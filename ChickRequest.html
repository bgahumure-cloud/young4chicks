<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chick Request - Young4ChickS</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #fdf5e6;
        margin: 0;
        padding: 0;
    }
    nav {
        background: #222;
        padding: 15px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    nav a {
        color: white;
        text-decoration: none;
        margin-left: 15px;
    }
    nav a:hover {
        color: orange;
    }
    .container {
        max-width: 600px;
        margin: 40px auto;
        background: white;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
    }
    h2 {
        text-align: center;
        color: orange;
    }
    .input-group {
        margin-bottom: 15px;
    }
    label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
    }
    input, select {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid #ccc;
    }
    button {
        width: 100%;
        padding: 12px;
        background: orange;
        border: none;
        border-radius: 5px;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    button:hover {
        background: darkorange;
    }
    .error {
        color: red;
        font-size: 14px;
        margin-bottom: 10px;
    }
</style>
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="logo">YOUNG 4<span style="color: orange;">CHICKS</span></div>
    <div>
        <a href="index.html">Home</a>
        <a href="track-request.html">Track Request</a>
    </div>
</nav>

<!-- Form Container -->
<div class="container">
    <h2>Chick Request Form</h2>
    <div class="error" id="errorMsg"></div>
    <form id="requestForm">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="name" required>
        </div>
        <div class="input-group">
            <label>Age</label>
            <input type="number" id="age" required>
        </div>
        <div class="input-group">
            <label>NIN Number</label>
            <input type="text" id="nin" required>
        </div>
        <div class="input-group">
            <label>Recommender Name</label>
            <input type="text" id="recommenderName" required>
        </div>
        <div class="input-group">
            <label>Recommender NIN</label>
            <input type="text" id="recommenderNin" required>
        </div>
        <div class="input-group">
            <label>Type of Farmer</label>
            <select id="farmerType" required>
                <option value="">Select...</option>
                <option value="starter">Starter</option>
                <option value="returning">Returning</option>
            </select>
        </div>
        <div class="input-group">
            <label>Type of Chicks</label>
            <select id="chickType" required>
                <option value="">Select...</option>
                <option value="layers">Layers</option>
                <option value="broilers">Broilers</option>
                <option value="local">Local</option>
                <option value="exotic">Exotic</option>
            </select>
        </div>
        <div class="input-group">
            <label>Number of Chicks</label>
            <input type="number" id="chickNumber" required>
        </div>
        <button type="submit">Submit Request</button>
    </form>
</div>

<script>
document.getElementById('requestForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const age = parseInt(document.getElementById('age').value);
    const nin = document.getElementById('nin').value.trim();
    const recommenderName = document.getElementById('recommenderName').value.trim();
    const recommenderNin = document.getElementById('recommenderNin').value.trim();
    const farmerType = document.getElementById('farmerType').value;
    const chickType = document.getElementById('chickType').value;
    const chickNumber = parseInt(document.getElementById('chickNumber').value);
    const errorMsg = document.getElementById('errorMsg');

    // Validation
    if (farmerType === "starter" && chickNumber > 100) {
        errorMsg.textContent = "Starters can request up to 100 chicks only.";
        return;
    }
    if (farmerType === "returning" && chickNumber > 500) {
        errorMsg.textContent = "Returning farmers can request up to 500 chicks only.";
        return;
    }
    if (age < 18 || age > 30) {
        errorMsg.textContent = "Age must be between 18 and 30 years.";
        return;
    }

    // Save to localStorage
    const request = {
        name, age, nin, recommenderName, recommenderNin,
        farmerType, chickType, chickNumber,
        status: "Pending Approval"
    };

    let requests = JSON.parse(localStorage.getItem('chickRequests')) || [];
    requests.push(request);
    localStorage.setItem('chickRequests', JSON.stringify(requests));

    alert("Request submitted successfully! You can track it using your NIN.");
    document.getElementById('requestForm').reset();
    errorMsg.textContent = "";
});
</script>

</body>
</html>
