<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Young4ChickS - Farmer Login</title>
    <style>
        /* Reset & Base Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffce54, #ff7f50);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Login Container */
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease-in-out;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff7f50;
        }

        /* Input Fields */
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            transition: 0.3s;
        }

        .login-container input:focus {
            border-color: #ff7f50;
            box-shadow: 0 0 5px rgba(255,127,80,0.5);
        }

        /* Login Button */
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #ff7f50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-container button:hover {
            background: #ff5733;
        }

        /* Message Styling */
        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: red;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(-20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Farmer Login</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="Enter Email" required>
            <input type="password" id="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
            <p class="message" id="message"></p>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const messageEl = document.getElementById("message");

            try {
                const response = await fetch("http://localhost:5000/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageEl.style.color = "green";
                    messageEl.textContent = "Login successful! Redirecting...";
                    localStorage.setItem("token", data.token);
                    setTimeout(() => {
                        window.location.href = "/dashboard.html"; // Change to your dashboard page
                    }, 1500);
                } else {
                    messageEl.style.color = "red";
                    messageEl.textContent = data.message || "Invalid login credentials";
                }
            } catch (error) {
                console.error("Error:", error);
                messageEl.style.color = "red";
                messageEl.textContent = "Something went wrong. Please try again.";
            }
        });
    </script>

</body>
</html>
